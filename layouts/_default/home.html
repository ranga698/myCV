{{ define "main" }}
<section class="container" id="cv-page">
  <div class="cv-layout">
    {{ partial "cv-hero.html" . }}
    <main class="cv-main">
      {{ with .Site.Data.profile }}
        <h2>Kim jestem</h2>
        <div class="summary">{{ .summary | markdownify }}</div>
      {{ end }}

      <h2>Umiejętności</h2>
      <p class="skills-hint">Rozwiń umiejętność i dowiedz się więcej lub przejdź do <a class="hint-link" href="/posts/">PROJEKTY ↗</a></p>
      <!-- zwinięte na czas przebudów (nie usuwać): ptaszek-chevron z hinta:
      <span class="chevron-down-inline"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Kliknij w&nbsp;umiejętność, żeby dowiedzieć się <span class="highlight">więcej</span>&nbsp;↗ (strzałka)
      -->
      {{ partial "cv-skills.html" . }}
    </main>
  </div>
</section>
{{ end }}
