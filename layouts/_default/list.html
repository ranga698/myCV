{{ define "main" }}
<section class="container">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="entries-list">
    {{ range .Pages }}
      <article class="entry-card">
        <div class="entry-type {{ if eq .Type "skill" }}skill-type{{ else }}post-type{{ end }}">
          {{ if eq .Type "skill" }}🔧 Opis umiejętności{{ else }}📝 Artykuł{{ end }}
        </div>
        <h3><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
        <div class="entry-date">{{ .Date.Format "2 January 2006" }}</div>
        <p class="entry-excerpt">{{ .Description | default .Summary | truncate 200 }}</p>
      </article>
    {{ end }}
  </div>
</section>
{{ end }}
