{{ define "main" }}
<section class="container">
  <article class="single-page">
    <h1>{{ .Title }}</h1>
    <div class="entry-date">{{ partial "date-pl.html" . }}</div>
    {{ if .Params.tags }}
      <div class="tags">
        {{ range .Params.tags }}
          <span class="tag">{{ . }}</span>
        {{ end }}
      </div>
    {{ end }}
    <div class="content">
      {{ .Content }}
    </div>
  </article>
</section>
{{ end }}
